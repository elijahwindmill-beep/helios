<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paper direction</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:wght@500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',sans-serif;background:#F4F1EA;color:#1F1D1A}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F4F1EA">

<svg width="1440" height="900" viewBox="0 0 1440 900" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs>
<path id="pc" d="M520 260 C600 200 760 210 860 280 C960 350 980 480 900 560 C820 640 660 650 570 580 C480 510 450 320 520 260 Z" fill="none" stroke="#CFC8B7" stroke-width="1" vector-effect="non-scaling-stroke"></path>
<filter id="pb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
</defs>
<rect width="1440" height="900" fill="#F4F1EA"></rect>
<use href="#pc" transform="translate(720 430) scale(0.32) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(0.55) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(0.78) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(1) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(1.25) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(1.5) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(1.78) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(2.1) translate(-720 -430)"></use>
<use href="#pc" transform="translate(720 430) scale(2.5) translate(-720 -430)"></use>
<polygon points="640,330 420,250 290,380 380,570 560,520" fill="#3B4A5A" opacity="0.30" filter="url(#pb)"></polygon>
<polygon points="1010,300 900,250 860,330 940,390" fill="#3B4A5A" opacity="0.22" filter="url(#pb)"></polygon>
<polygon points="600,690 470,640 430,720 540,760" fill="#3B4A5A" opacity="0.18" filter="url(#pb)"></polygon>
<ellipse cx="720" cy="430" rx="330" ry="122" fill="none" stroke="#1F1D1A" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"></ellipse>
<path d="M250 610 C400 540 520 560 640 490 S900 380 1010 300" fill="none" stroke="#C98A0F" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"></path>
</svg>

<div style="position: absolute; left: 1028px; top: 330px; width: 22px; height: 22px; border-radius: 50%; background: #E8A317; box-shadow: 0 0 0 6px rgba(232,163,23,0.25)"></div>
<div style="position: absolute; left: 1058px; top: 328px; padding: 4px 9px; border-radius: 8px; background: #FBFAF7; border: 1px solid #DDD8CC; font-family: 'JetBrains Mono', monospace; font-size: 12px">10:06 · 127.2° · 28.4°</div>

<div style="position: absolute; left: 708px; top: 400px; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #1F1D1A"></div>
<div style="position: absolute; left: 744px; top: 400px; padding: 5px 10px; border-radius: 8px; background: #FBFAF7; border: 1px solid #DDD8CC; font-size: 13px; font-weight: 600">Seceda Ridgeline</div>
<div style="position: absolute; left: 1004px; top: 260px; width: 34px; height: 34px; border-radius: 9px; background: #FBFAF7; border: 1px solid #1F1D1A; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="3.5"></circle></svg>
</div>
<div style="position: absolute; left: 236px; top: 596px; width: 14px; height: 14px; border-radius: 50%; background: #FBFAF7; border: 3px solid #1F1D1A"></div>
<div style="position: absolute; left: 262px; top: 590px; padding: 4px 9px; border-radius: 8px; background: #FBFAF7; border: 1px solid #DDD8CC; font-size: 12px">Trailhead</div>

<div style="position: absolute; left: 24px; top: 24px; width: 264px; box-sizing: border-box; padding: 18px; background: #FBFAF7; border: 1px solid #DDD8CC; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,29,26,0.06)">
<div style="font-family: Newsreader, serif; font-size: 22px; font-weight: 600; margin-bottom: 4px">Seceda · Oct shoot</div>
<div style="font-size: 12px; color: #6B665C; margin-bottom: 16px">Project · 3 clips</div>
<div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B665C; margin-bottom: 8px">Base layer</div>
<div style="display: flex; padding: 3px; gap: 3px; background: #EDE9DF; border-radius: 10px; margin-bottom: 16px">
<button style="flex: 1; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #4A463F; font-size: 13px">Satellite</button>
<button aria-pressed="true" style="flex: 1; height: 36px; border: 0; border-radius: 8px; background: #FBFAF7; color: #1F1D1A; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(31,29,26,0.12)">Paper</button>
<button style="flex: 1; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #4A463F; font-size: 13px">Terrain</button>
</div>
<div style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B665C; margin-bottom: 4px">Overlays</div>
<sc-for list="{{layers}}" as="item" hint-placeholder-count="7">
<button aria-pressed="{{item.on}}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0; border: 0; border-top: 1px solid #ECE8DD; background: transparent; text-align: left">
<span style="width: 10px; height: 10px; border-radius: 3px; background: {{item.swatch}}"></span>
<span style="flex-grow: 1; font-size: 14px; color: #1F1D1A">{{item.name}}</span>
<span style="position: relative; width: 34px; height: 20px; border-radius: 10px; background: {{item.track}}">
<span style="position: absolute; top: 2px; left: {{item.knob}}px; width: 16px; height: 16px; border-radius: 50%; background: #FBFAF7"></span>
</span>
</button>
</sc-for>
</div>

<label style="position: absolute; left: 312px; top: 24px; width: 420px; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #FBFAF7; border: 1px solid #DDD8CC; border-radius: 24px; box-shadow: 0 1px 2px rgba(31,29,26,0.06)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B665C" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<input value="Seceda Ridgeline" aria-label="Search place" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1F1D1A">
</label>

<div style="position: absolute; left: 1156px; top: 24px; width: 260px; box-sizing: border-box; padding: 16px 18px; background: #FBFAF7; border: 1px solid #DDD8CC; border-radius: 16px; box-shadow: 0 1px 2px rgba(31,29,26,0.06)">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 500">10:06</span>
<span style="font-size: 13px; color: #4A463F">26 Sep 2026</span>
</div>
<div style="display: flex; gap: 20px; margin-top: 10px; font-size: 12px; color: #6B665C">
<span>Elevation <b style="color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-weight: 500">28.4°</b></span>
<span>Azimuth <b style="color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-weight: 500">127.2°</b></span>
</div>
<div style="display: flex; gap: 20px; margin-top: 6px; font-size: 12px; color: #6B665C">
<span>Sunrise <b style="color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-weight: 500">07:05</b></span>
<span>Sunset <b style="color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-weight: 500">19:05</b></span>
</div>
</div>

<div style="position: absolute; left: 1372px; top: 500px; display: flex; flex-direction: column; gap: 8px">
<button aria-label="Zoom in" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDD8CC; background: #FBFAF7; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="Zoom out" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDD8CC; background: #FBFAF7; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button aria-label="Reset north and tilt" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DDD8CC; background: #FBFAF7; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l4 9h-8z"></path><path d="M12 21l-4-9h8z" stroke-opacity="0.35"></path></svg></button>
</div>

<div style="position: absolute; left: 24px; top: 640px; width: 1392px; height: 236px; box-sizing: border-box; padding: 14px 16px; background: #FBFAF7; border: 1px solid #DDD8CC; border-radius: 18px; box-shadow: 0 2px 8px rgba(31,29,26,0.08)">
<div style="display: flex; align-items: center; gap: 10px; height: 44px">
<button aria-label="Previous keyframe" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #DDD8CC; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14M19 5l-9 7 9 7z"></path></svg></button>
<button aria-label="Play" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #E8A317; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1F1D1A" stroke="#1F1D1A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></button>
<button aria-label="Next keyframe" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #DDD8CC; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14M5 5l9 7-9 7z"></path></svg></button>
<button aria-label="Loop" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #DDD8CC; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F1D1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H4"></path></svg></button>
<span style="margin-left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px">0:12 <span style="color: #6B665C">/ 0:20</span></span>
<div style="display: flex; gap: 6px; margin-left: 28px">
<button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #1F1D1A; background: #1F1D1A; color: #FBFAF7; font-size: 13px">Sunrise ridge</button>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DDD8CC; background: transparent; color: #1F1D1A; font-size: 13px">Valley light</button>
<button aria-label="New clip" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1px dashed #A8A293; background: transparent; color: #4A463F; font-size: 13px">+ Clip</button>
</div>
<span style="flex-grow: 1"></span>
<button style="height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid #1F1D1A; background: transparent; color: #1F1D1A; font-size: 14px; font-weight: 500">◇ Add keyframe</button>
<button style="height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: #1F1D1A; color: #FBFAF7; font-size: 14px; font-weight: 500">Export video</button>
</div>

<div style="display: flex; gap: 16px; margin-top: 10px">
<div style="width: 112px; padding-top: 28px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #4A463F">
<div style="height: 32px; display: flex; align-items: center">Sun time</div>
<div style="height: 32px; display: flex; align-items: center">Camera</div>
<div style="height: 32px; display: flex; align-items: center">Routes</div>
<div style="height: 32px; display: flex; align-items: center">Photos</div>
</div>
<div style="position: relative; width: 1200px">
<div style="position: relative; height: 26px; background-image: repeating-linear-gradient(90deg,#BDB6A5 0,#BDB6A5 1px,transparent 1px,transparent 60px); background-size: 100% 8px; background-repeat: no-repeat; background-position: left bottom">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="5">
<span style="position: absolute; top: 0; left: {{t.left}}px; padding-left: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6B665C">{{t.label}}</span>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="position: relative; height: 32px; background: #F1EEE6; border-radius: 6px">
<div style="position: absolute; left: 0; top: 15px; width: 1200px; height: 2px; background: #E8A317; opacity: 0.55"></div>
<sc-for list="{{timeKeys}}" as="k" hint-placeholder-count="3">
<div style="position: absolute; left: {{k.left}}px; top: 0; height: 32px; display: flex; align-items: center">
<div style="width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: #E8A317; border: 1px solid #1F1D1A"></div>
<span style="margin-left: 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #1F1D1A">{{k.label}}</span>
</div>
</sc-for>
</div>
<div style="position: relative; height: 32px; background: #F1EEE6; border-radius: 6px">
<div style="position: absolute; left: 0; top: 15px; width: 1200px; height: 2px; background: #3B4A5A; opacity: 0.4"></div>
<sc-for list="{{camKeys}}" as="k" hint-placeholder-count="4">
<div style="position: absolute; left: {{k.left}}px; top: 10px; width: 12px; height: 12px; margin-left: -6px; transform: rotate(45deg); background: #3B4A5A; border: 1px solid #1F1D1A"></div>
</sc-for>
</div>
<div style="position: relative; height: 32px; background: #F1EEE6; border-radius: 6px">
<div style="position: absolute; left: 0; top: 8px; width: 1200px; height: 16px; border-radius: 4px; background: #C98A0F; opacity: 0.35"></div>
</div>
<div style="position: relative; height: 32px; background: #F1EEE6; border-radius: 6px">
<div style="position: absolute; left: 300px; top: 8px; width: 540px; height: 16px; border-radius: 4px; background: #1F1D1A; opacity: 0.22"></div>
</div>
</div>
<div style="position: absolute; left: 720px; top: 0; bottom: 0; width: 2px; background: #C98A0F"></div>
<div style="position: absolute; left: 713px; top: 0; width: 16px; height: 12px; background: #C98A0F; border-radius: 3px 3px 8px 8px"></div>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (name, swatch, isOn) => ({ name, swatch, on: isOn, track: isOn ? '#1F1D1A' : '#D5CFC0', knob: isOn ? 16 : 2 });
    return {
      layers: [
        on('Cast shadows', '#3B4A5A', true),
        on('Contours', '#BDB6A5', true),
        on('Sun path', '#E8A317', true),
        on('Routes', '#C98A0F', true),
        on('Places', '#1F1D1A', true),
        on('Photos', '#6B7F6A', false),
        on('Labels', '#8A857B', true)
      ],
      ticks: [0, 5, 10, 15, 20].map((s) => ({ left: s * 60, label: '0:' + String(s).padStart(2, '0') })),
      timeKeys: [{ left: 0, label: '07:05' }, { left: 720, label: '10:06' }, { left: 1200 - 60, label: '11:40' }],
      camKeys: [{ left: 0 }, { left: 360 }, { left: 720 }, { left: 1140 }]
    };
  }
}
</script>
</body>
</html>
